name: Prototyping Agent

on:
  repository_dispatch:
    types: [prototype]

# Only one agent run per branch at a time.
concurrency:
  group: prototype-${{ github.event.client_payload.branch }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Configure OpenCode for MiniMax
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/config.json" <<'EOF'
          {
            "provider": {
              "minimax": {
                "id": "minimax",
                "name": "MiniMax",
                "api_key_env": "MINIMAX_API_KEY",
                "models": {
                  "${{ secrets.MINIMAX_MODEL || 'MiniMax-M2.5' }}": {
                    "id": "${{ secrets.MINIMAX_MODEL || 'MiniMax-M2.5' }}",
                    "name": "MiniMax M2.5",
                    "api_url": "${{ secrets.MINIMAX_API_BASE || 'https://api.minimax.io' }}/v1/text/chatcompletion_v2",
                    "can_reason": true,
                    "supports_tool_calls": true
                  }
                }
              }
            },
            "model": {
              "default": "minimax/${{ secrets.MINIMAX_MODEL || 'MiniMax-M2.5' }}"
            }
          }
          EOF

      - name: Run OpenCode agent
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          opencode -p "You are a prototyping agent. Implement the following feature request in this codebase.

          Title: ${{ github.event.client_payload.title }}
          Description: ${{ github.event.client_payload.description }}
          Affected area: ${{ github.event.client_payload.affected_area }}

          Instructions:
          - Read relevant files to understand the codebase structure and conventions.
          - Make minimal, focused changes to prototype this feature.
          - After writing code, run the build (npm run build or npm run typecheck) to verify it compiles.
          - If the build fails, fix the errors and retry.
          - Do not modify unrelated files." -q

      - name: Push changes
        run: |
          git config user.name "lilypad-agent[bot]"
          git config user.email "lilypad-agent[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: prototype \"$FEATURE_TITLE\"

          Auto-generated by the lilypad prototyping agent (via OpenCode)."
            git push
          fi
        env:
          FEATURE_TITLE: ${{ github.event.client_payload.title }}

      - name: Comment on PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "The prototyping agent has pushed an initial implementation to this branch. Please review the changes."