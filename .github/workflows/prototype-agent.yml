name: Prototyping Agent

on:
  repository_dispatch:
    types: [prototype]

# Only one agent run per branch at a time.
concurrency:
  group: prototype-${{ github.event.client_payload.branch }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      - name: Cache OpenCode
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/opencode
          key: opencode-${{ runner.os }}

      - name: Install OpenCode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Configure OpenCode for MiniMax
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_API_BASE: ${{ secrets.MINIMAX_API_BASE || 'https://api.minimax.io' }}
          MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL || 'MiniMax-M2.5' }}
        run: |
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "::error::MINIMAX_API_KEY is not configured"
            exit 1
          fi

          MINIMAX_API_BASE="${MINIMAX_API_BASE%/}"
          case "$MINIMAX_API_BASE" in
            */v1) ;;
            *) MINIMAX_API_BASE="$MINIMAX_API_BASE/v1" ;;
          esac

          cat > .opencode.json <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "provider": {
              "minimax": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "MiniMax",
                "options": {
                  "apiKey": "{env:MINIMAX_API_KEY}",
                  "baseURL": "${MINIMAX_API_BASE}"
                },
                "models": {
                  "${MINIMAX_MODEL}": {
                    "name": "MiniMax"
                  }
                }
              }
            },
            "model": "minimax/${MINIMAX_MODEL}"
          }
          EOF

      - name: Run OpenCode agent
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          FEATURE_TITLE: ${{ github.event.client_payload.title }}
          FEATURE_DESCRIPTION: ${{ github.event.client_payload.description }}
          FEATURE_AFFECTED_AREA: ${{ github.event.client_payload.affected_area }}
        run: |
          set -o pipefail
          PROMPT="$(cat <<EOF
          You are a prototyping agent. Implement the following feature request in this codebase.

          Title: $FEATURE_TITLE
          Description: $FEATURE_DESCRIPTION
          Affected area: $FEATURE_AFFECTED_AREA

          Instructions:
          - Read relevant files to understand the codebase structure and conventions.
          - Make minimal, focused changes to prototype this feature.
          - After writing code, run the build (npm run build or npm run typecheck) to verify it compiles.
          - If the build fails, fix the errors and retry.
          - Do not modify unrelated files.
          EOF
          )"

          opencode run "$PROMPT" 2>&1 | tee /tmp/opencode.log

          if grep -Eiq 'invalid api key|unauthorized|authentication failed|provider.*not found|model.*not found' /tmp/opencode.log; then
            echo "::error::OpenCode reported an authentication or provider error; see the agent log above"
            exit 1
          fi

          if [ -z "$(git status --porcelain -- . ':(exclude).opencode.json')" ]; then
            echo "::error::OpenCode completed without making any changes"
            exit 1
          fi

      - name: Push changes
        run: |
          git config user.name "lilypad-agent[bot]"
          git config user.email "lilypad-agent[bot]@users.noreply.github.com"
          rm -f .opencode.json
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No changes to commit"
            exit 1
          fi

          git commit -m "feat: prototype \"$FEATURE_TITLE\"

          Auto-generated by the lilypad prototyping agent (via OpenCode)."
          git push
        env:
          FEATURE_TITLE: ${{ github.event.client_payload.title }}

      - name: Comment on PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "The prototyping agent has pushed an initial implementation to this branch. Please review the changes."
